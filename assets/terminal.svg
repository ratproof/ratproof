<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="Terminal showing whoami, tech stack and bot status" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="290" rx="10" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="719" height="289" rx="10" fill="none" stroke="#30363d"/>
  <path d="M0 10a10 10 0 0 1 10-10h700a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
  <circle cx="22" cy="18" r="5" fill="#484f58"/><circle cx="42" cy="18" r="5" fill="#484f58"/><circle cx="62" cy="18" r="5" fill="#484f58"/>
  <text x="360" y="23" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">mason@vps: ~</text>
  <text x="28" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" opacity="0" xml:space="preserve"><tspan fill="#58a6ff">$ </tspan><tspan fill="#e6edf3">whoami</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0429;0.0529;0.94;1" dur="14.0s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" opacity="0" xml:space="preserve"><tspan fill="#7ee787">ratproof</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1214;0.1314;0.94;1" dur="14.0s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" opacity="0" xml:space="preserve"><tspan fill="#58a6ff">$ </tspan><tspan fill="#e6edf3">cat stack.txt</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2000;0.2100;0.94;1" dur="14.0s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="154" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" opacity="0" xml:space="preserve"><tspan fill="#8b949e">python  discord.py  postgresql  react  linux</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2786;0.2886;0.94;1" dur="14.0s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" opacity="0" xml:space="preserve"><tspan fill="#58a6ff">$ </tspan><tspan fill="#e6edf3">systemctl is-active bots</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3571;0.3671;0.94;1" dur="14.0s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" opacity="0" xml:space="preserve"><tspan fill="#7ee787">active</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4357;0.4457;0.94;1" dur="14.0s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" opacity="0" xml:space="preserve"><tspan fill="#58a6ff">$ </tspan><tspan fill="#e6edf3">ls ~/</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5143;0.5243;0.94;1" dur="14.0s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" opacity="0" xml:space="preserve"><tspan fill="#8b949e">bots/  web/  infra/  automation/</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5929;0.6029;0.94;1" dur="14.0s" repeatCount="indefinite"/>
  </text>
