<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Mason, Discord bots, backend tooling, automation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#58a6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="typeclip">
      <rect x="60" y="118" width="0" height="40">
        <animate attributeName="width" values="0;424;424;0" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="10" fill="#0d1117"/>
  <rect width="900" height="200" rx="10" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="199" rx="10" fill="none" stroke="#30363d"/>

  <rect x="-300" y="0" width="300" height="2" fill="url(#scan)">
    <animate attributeName="x" from="-300" to="900" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="-300" y="198" width="300" height="2" fill="url(#scan)">
    <animate attributeName="x" from="900" to="-300" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="95" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="54" font-weight="700" fill="#e6edf3">mason<tspan fill="#58a6ff">.baby</tspan></text>

  <g clip-path="url(#typeclip)">
    <text x="60" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="20" textLength="420" lengthAdjust="spacing" fill="#8b949e">discord bots / backend / automation</text>
  </g>
  <rect x="60" y="130" width="11" height="22" fill="#58a6ff">
    <animate attributeName="x" values="60;484;484;60" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(790 40)" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 10 L0 40 L20 70"/>
    <path d="M44 10 L64 40 L44 70"/>
    <path d="M36 4 L28 76" stroke-opacity="0.6"/>
    <animateTransform attributeName="transform" type="translate" values="790 40;790 34;790 40" dur="4s" repeatCount="indefinite"/>
  </g>
</svg>
